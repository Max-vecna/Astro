<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat Global – Sala Fixa</title>
  
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes"> 
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chat Global">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/724/724715.png">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900">

<div class="w-full h-[100dvh] bg-white flex flex-col overflow-hidden">

  <div class="p-2 border-b flex items-center justify-between text-sm bg-gray-50 rounded-t-xl" style="
    position: absolute;
    top: 0;
    width: 100%;
">
    <div class="flex items-center gap-2">
        <button id="notifBtn" class="p-2 rounded-full hover:bg-gray-200 transition-colors text-gray-500" title="Ativar Notificações">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
        </button>
        
        <div id="presenceBadge" class="hidden flex items-center gap-1.5 px-2 py-1 bg-white border rounded-full shadow-sm">
            <span class="w-2 h-2 rounded-full bg-green-500 online-indicator"></span>
            <span id="onlineCount" class="text-xs font-semibold text-gray-600">1 Online</span>
        </div>
        <div class="text-[10px] text-gray-400 leading-tight">
            &copy; <span id="year"></span> Chat Global.<br>Todos os direitos reservados.
        </div>
    </div>
    
    <select id="lang" class="border rounded p-1 selectable text-xs font-medium bg-white text-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
      <option value="pt">Português</option>
      <option value="ar">Árabe</option>
      <option value="es">Espanhol</option>
      <option value="ja">Japonês</option>
      <option value="zh">Chinês</option>
    </select>
  </div>

  <div id="chat" class="flex-1 overflow-y-auto p-3 space-y-4 relative bg-white" style="
    position: absolute;
    top: 51px;
    bottom: 75px; width: 100%;
">
    <div id="loadingOld" class="absolute top-2 left-1/2 -translate-x-1/2 text-xs text-gray-500 hidden">
      Carregando mensagens antigas…
    </div>
    
    <!-- Indicador de Digitação (Movido para dentro do chat) -->
    <div id="typingIndicator" class="hidden w-fit bg-gray-100 rounded-full px-3 py-1.5 text-xs text-gray-500 italic mb-2 transition-all duration-300 flex items-center gap-1">
        <span class="animate-pulse">●</span>
        <span id="typingText">Alguém está a escrever...</span>
    </div>
  </div>

  <div class="p-3 border-t flex flex-col gap-1 bg-gray-50 rounded-b-xl"  style="
    position: absolute;
    width: 100%;
    bottom: 0;
">
    <div class="flex gap-2 items-center w-full">
      <input id="msg" placeholder="Digite sua mensagem" class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all shadow-sm" autocomplete="off" />
      <button id="send" class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 flex items-center justify-center rounded-full shrink-0 shadow-md transition-all active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3 21l18-9L3 3l3 9zm0 0h6" />
          </svg>
      </button>
    </div>    
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content shadow-2xl">
    <h2 class="font-bold text-lg mb-1 shrink-0 text-gray-800">Escolha uma tradução</h2>
    <p class="text-xs text-gray-500 mb-4 shrink-0">Selecione a melhor opção para substituir a mensagem.</p>
    
    <ul id="variants" class="text-sm space-y-2 selectable overflow-y-auto flex-1 pr-1 custom-scrollbar" style="min-height: 120px;"></ul>
    
    <div class="mt-4 flex justify-between items-center shrink-0 pt-3 border-t">
        <button id="loadMore" class="text-blue-600 text-sm font-semibold hover:bg-blue-50 px-3 py-2 rounded transition-colors flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            3 Variações
        </button>
        <button id="closeModal" class="text-gray-500 text-sm hover:bg-gray-100 px-3 py-2 rounded transition-colors">
            Cancelar
        </button>
    </div>
  </div>
</div>

<script>
    // Proteção adicional contra teclas de atalho e comportamentos UI
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
            e.preventDefault();
        }
    });

    // Listener Unificado para cliques globais
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.menu-trigger') && !e.target.closest('.options-menu')) {
            document.querySelectorAll('.options-menu.show').forEach(menu => {
                menu.classList.remove('show');
                menu.classList.remove('open-left');
                menu.classList.remove('open-right');
            });
        }
        if (!e.target.classList.contains('context-text') && !e.target.closest('.ctx-opt')) {
            // resetAllContexts será chamado via bubble ou eventos específicos
        }
    });

    document.addEventListener('scroll', function() {
        document.querySelectorAll('.options-menu.show').forEach(menu => {
            menu.classList.remove('show');
            menu.classList.remove('open-left');
            menu.classList.remove('open-right');
        });
    }, true);
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, set, get, query, orderByChild, remove, update, onValue, onDisconnect, onChildChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
  
  import {
  traduzir,
  gerarVariacoes,
  analisarContexto
} from './translationService.js';

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }

  const firebaseConfig = {
    apiKey: "AIzaSyAxb2s4tzbtD1arG9UAf7UrzhFqbRrrsl8",
    authDomain: "astro-642b6.firebaseapp.com",
    databaseURL: "https://astro-642b6-default-rtdb.firebaseio.com",
    projectId: "astro-642b6",
    storageBucket: "astro-642b6.appspot.com",
    messagingSenderId: "141832763492",
    appId: "1:141832763492:web:c8f6a529849bab54ee8771"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const SALA_ID = "sala_fixa";
  const chatEl = document.getElementById("chat");
  const msgEl = document.getElementById("msg");
  const typingIndicator = document.getElementById("typingIndicator");
  const typingText = document.getElementById("typingText");
  
  let heartbeatInterval = null; 
  let typingTimeout = null;

  function escapeRegex(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  let messageElements = {}; 
  let nick = localStorage.getItem("chat_nick");
  if (!nick) {
    nick = "User-" + Math.floor(Math.random() * 9000 + 1000);
    localStorage.setItem("chat_nick", nick);
  }

  const presenceRef = ref(db, `salas/${SALA_ID}/presenca/${nick}`);
  const connectedRef = ref(db, ".info/connected");
  const presenceListRef = ref(db, `salas/${SALA_ID}/presenca`);
  const presenceBadge = document.getElementById("presenceBadge");
  const onlineCountEl = document.getElementById("onlineCount");

  function updatePresence() {
    if (document.visibilityState === 'visible' || heartbeatInterval) { 
        // Usamos update para não sobrescrever o status de "typing" se ele existir
        update(presenceRef, { 
            online: true, 
            lastChanged: Date.now() 
        });
    } else {
        remove(presenceRef);
    }
  }

  onValue(connectedRef, (snap) => {
    if (snap.val() === true) {
      updatePresence();
      onDisconnect(presenceRef).remove();
      if (!heartbeatInterval) {
          heartbeatInterval = setInterval(() => {
              if (document.hidden) { updatePresence(); }
          }, 30000); 
      }
    } else {
      if (heartbeatInterval) {
          clearInterval(heartbeatInterval);
          heartbeatInterval = null;
      }
    }
  });

  document.addEventListener("visibilitychange", () => {
      updatePresence(); 
      if (document.hidden) {
          if (!heartbeatInterval) {
              heartbeatInterval = setInterval(() => { updatePresence(); }, 30000);
          }
      } else {
          if (heartbeatInterval) {
              clearInterval(heartbeatInterval);
              heartbeatInterval = null;
          }
      }
  });

  onValue(presenceListRef, (snap) => {
      const count = snap.size; 
      const typingUsers = [];

      snap.forEach(child => {
          const userData = child.val();
          // Verifica se o usuário está digitando e não é o próprio usuário atual
          if (child.key !== nick && userData.typing) {
              typingUsers.push(child.key);
          }
      });

      // Atualiza Badge de Online
      if (count > 0) {
          presenceBadge.classList.remove('hidden');
          presenceBadge.classList.add('flex');
          const text = count === 1 ? "Só você" : `${count} Online`;
          onlineCountEl.textContent = text;
      } else {
          presenceBadge.classList.add('hidden');
      }

      // Atualiza Indicador de Digitação
      if (typingUsers.length > 0) {
          const text = typingUsers.length === 1 
            ? `${typingUsers[0]} está a escrever...` 
            : typingUsers.length === 2
                ? `${typingUsers[0]} e ${typingUsers[1]} estão a escrever...`
                : `${typingUsers.length} pessoas estão a escrever...`;
          
          typingText.textContent = text;
          typingIndicator.classList.remove('hidden');
          
          // Move o indicador para o final do chat sempre que ele aparecer
          chatEl.appendChild(typingIndicator);
          chatEl.scrollTop = chatEl.scrollHeight;
      } else {
          typingIndicator.classList.add('hidden');
      }
  });

  // Lógica de Digitação do Usuário Local
  msgEl.addEventListener("input", () => {
      // Atualiza status para typing: true
      update(presenceRef, { typing: true });

      // Limpa timeout anterior
      if (typingTimeout) clearTimeout(typingTimeout);

      // Define timeout para remover status de typing após 2 segundos de inatividade
      typingTimeout = setTimeout(() => {
          update(presenceRef, { typing: false });
      }, 2000);
  });

  const loadTime = Date.now();
  const originalTitle = document.title;
  let notificationAudio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");
  notificationAudio.volume = 0.5;
  let audioUnlocked = false;
  const notifBtn = document.getElementById('notifBtn');
  
  function updateNotifIcon() {
    if (Notification.permission === 'granted') {
        notifBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>`;
        notifBtn.title = "Notificações Ativadas";
    } else {
        notifBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>`;
        notifBtn.title = "Ativar Notificações";
    }
  }

  if ("Notification" in window) {
      updateNotifIcon();
  } else {
      notifBtn.style.display = 'none';
  }

  async function unlockAudioAndRequestPermission() {
    if (!audioUnlocked) {
        try {
            await notificationAudio.play();
            notificationAudio.pause();
            notificationAudio.currentTime = 0;
            audioUnlocked = true;
        } catch (e) {}
    }
    if ("Notification" in window && Notification.permission !== "granted") {
        try {
            const permission = await Notification.requestPermission();
            updateNotifIcon();
            if (permission === 'granted') {
                notificationAudio.play().catch(e => {});
                new Notification("Chat Global", { body: "Notificações ativadas!" });
            }
        } catch (e) {}
    }
  }

  notifBtn.onclick = unlockAudioAndRequestPermission;
  document.body.addEventListener('click', () => { if(!audioUnlocked) unlockAudioAndRequestPermission(); }, { once: true });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      document.title = originalTitle;
    }
  });

 async function sendNativeNotification(sender, text) {
    if (!("serviceWorker" in navigator)) return;
    const registration = await navigator.serviceWorker.ready;
    registration.showNotification(`Nova mensagem de ${sender}`, {
      body: text,
      icon: "https://cdn-icons-png.flaticon.com/512/724/724715.png",
      badge: "https://cdn-icons-png.flaticon.com/512/724/724715.png",
      tag: "chat-msg",
      renotify: true
    });
  }

  let TARGET_LANG = localStorage.getItem("chat_lang") || "pt";
  const langSelect = document.getElementById("lang");
  langSelect.value = TARGET_LANG;
  
  function resetAllContexts() {
    const contextElements = document.querySelectorAll('.context-text');
    contextElements.forEach(el => {
        const messageDiv = el.closest('.message');
        if (messageDiv) {
            const key = messageDiv.dataset.key;
            if (messageElements[key]) {
                updateMessageDOM(messageElements[key].dom, messageElements[key].data, key);
            }
        }
    });
  }

  document.addEventListener('click', (e) => {
     if (!e.target.classList.contains('context-text') && !e.target.closest('.ctx-opt')) {
         resetAllContexts();
     }
  });

  msgEl.onfocus = resetAllContexts;
  msgEl.onclick = resetAllContexts;

  langSelect.onchange = () => {
    resetAllContexts();
    TARGET_LANG = langSelect.value;
    localStorage.setItem("chat_lang", TARGET_LANG);
    fila.length = 0; 
    Object.keys(messageElements).forEach(key => {
        const item = messageElements[key];
        if (item.data.nick !== nick) {
            if (!item.data.traducoes || !item.data.traducoes[TARGET_LANG]) {
                const contentEl = item.dom.querySelector('.message-content');
                contentEl.textContent = "traduzindo...";
                contentEl.classList.add('italic', 'text-gray-400');
                fila.push({ 
                    texto: item.data.texto, 
                    element: contentEl, 
                    key, 
                    lang: TARGET_LANG 
                });
            }
        }
        updateMessageDOM(item.dom, item.data, key);
    });
    processarFila(); 
  };

  const salaRef = ref(db, `salas/${SALA_ID}`);
  if (!(await get(salaRef)).exists()) {
    await set(salaRef, { nome: "Sala Principal", criadaEm: Date.now() });
  }

  async function selectTranslation(key, newTranslation, contentElement) {
    contentElement.textContent = newTranslation;
    try {
      const updates = {};
      updates[TARGET_LANG] = newTranslation;
      await update(ref(db, `salas/${SALA_ID}/mensagens/${key}/traducoes`), updates);
    } catch (e) {
      console.error(e);
    }
    document.getElementById("modal").style.display = "none";
  }

 async function retraduzirMensagem(key, contentElement) {
  const snap = await get(ref(db, `salas/${SALA_ID}/mensagens/${key}`));
  const data = snap.val();
  if (!data?.texto) return;

  const textoOriginal = data.texto;

  contentElement.textContent = "Traduzindo novamente...";
  contentElement.classList.add("italic", "text-gray-400");
  
  try {
    const novaTraducao = await traduzir(textoOriginal, TARGET_LANG, true);
    contentElement.textContent = novaTraducao;
    contentElement.classList.remove("italic", "text-gray-400");
  } catch (e) {
    console.error("Erro ao retraduzir:", e);
    contentElement.textContent = "Erro ao retraduzir. Tente novamente.";
  }
}

  const fila = [];
  let processando = false;

  async function processarFila() {
    if (processando || fila.length === 0) return;
    processando = true;

    const item = fila.shift(); 
    try {
      const traduzido = await traduzir(item.texto, item.lang);
      if (item.element.textContent === "traduzindo...") {
          item.element.textContent = traduzido;
      }
      item.element.classList.remove('italic', 'text-gray-400');

      if (item.key) {
        const updates = {};
        updates[item.lang] = traduzido;
        await update(ref(db, `salas/${SALA_ID}/mensagens/${item.key}/traducoes`), updates);
      }
    } catch (e) {
      item.element.textContent = item.texto; 
      item.element.classList.remove('italic', 'text-gray-400');
    }

    processando = false;
    setTimeout(processarFila, 400); 
  }
  
  function startEdit(key, currentText, contentElement) {
    resetAllContexts();
    const messageDiv = contentElement.parentElement;
    const timeContainer = messageDiv.querySelector('.time-container');
    
    messageDiv.classList.add('editing');
    contentElement.style.display = 'none';
    timeContainer.style.display = 'none';
    
    messageDiv.querySelectorAll('.action-btn').forEach(btn => btn.style.display = 'none');

    const editArea = document.createElement('div');
    editArea.className = 'edit-area';
    
    const textarea = document.createElement('textarea');
    textarea.className = 'edit-textarea';
    textarea.value = currentText;
    textarea.rows = 2;
    
    const controls = document.createElement('div');
    controls.className = 'edit-controls';
    
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'edit-btn-action btn-cancel';
    cancelBtn.textContent = 'Cancelar';
    
    const saveBtn = document.createElement('button');
    saveBtn.className = 'edit-btn-action btn-save';
    saveBtn.textContent = 'Salvar';

    controls.appendChild(cancelBtn);
    controls.appendChild(saveBtn);
    editArea.appendChild(textarea);
    editArea.appendChild(controls);
    
    messageDiv.insertBefore(editArea, timeContainer);

    textarea.style.height = 'auto';
    textarea.style.height = (textarea.scrollHeight + 2) + 'px';
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight + 2) + 'px';
    });

    const cleanup = () => {
        editArea.style.opacity = '0';
        editArea.style.transform = 'translateY(-5px)';
        setTimeout(() => {
             editArea.remove();
             contentElement.style.display = 'block';
             timeContainer.style.display = 'flex';
             messageDiv.querySelectorAll('.action-btn').forEach(btn => btn.style.display = 'flex');
             messageDiv.classList.remove('editing');
        }, 200);
    };
    
    cancelBtn.onclick = cleanup;
    
    saveBtn.onclick = async () => {
        const newText = textarea.value.trim();
        if (newText === currentText) {
            cleanup(); 
            return;
        }
        
        if (newText.length === 0) {
            console.error("A mensagem não pode estar vazia.");
            return;
        }

        saveBtn.textContent = 'Salvando...';
        saveBtn.disabled = true;
        saveBtn.style.opacity = '0.7';

        try {
            await update(ref(db, `salas/${SALA_ID}/mensagens/${key}`), {
                texto: newText,
                edited: true,
                traducoes: null 
            });
            cleanup(); 
        } catch (e) {
            console.error("Erro ao salvar edição:", e);
            saveBtn.textContent = 'Salvar';
            saveBtn.disabled = false;
            saveBtn.style.opacity = '1';
        }
    };
    
    textarea.focus();
  }
  
  function updateMessageDOM(div, data, key) {
    const { nick: from, texto, traducoes, edited } = data;
    const isReceived = from !== nick;
    
    const content = div.querySelector('.message-content');
    const original = div.querySelector('.original');
    const timeContainer = div.querySelector('.time-container');
    
    content.classList.remove("context-text", "italic", "text-gray-400");
    content.onclick = null;

    div.querySelectorAll('.edited-tag').forEach(el => el.remove());
    
    if (isReceived) {
        const cachedTranslation = traducoes && traducoes[TARGET_LANG];
        const isTranslating = content.textContent === "traduzindo..." || content.textContent === "Traduzindo novamente..." || content.textContent.startsWith("ERRO:");
        
        if (cachedTranslation) {
            content.textContent = cachedTranslation;
            content.classList.remove('italic', 'text-gray-400');
        } else if (!isTranslating) { 
            content.textContent = "traduzindo...";
            content.classList.add('italic', 'text-gray-400');
            fila.push({ texto, element: content, key, lang: TARGET_LANG });
            processarFila();
        }
        if (original) original.textContent = texto;

    } else {
        content.textContent = texto;
        content.classList.remove('italic', 'text-gray-400');
        const editBtn = div.querySelector('.edit-btn');
        if (editBtn) {
            editBtn.onclick = () => {
              startEdit(key, content.textContent, content);
            };
        }
    }

    if (edited) {
        const editedTag = document.createElement("span");
        editedTag.className = "edited-tag text-xs";
        editedTag.textContent = "(editado)";
        timeContainer.prepend(editedTag);
    }
  }
  
  function createMessageDom(data, key) {
    const { nick: from, texto, timestamp, edited } = data;

    const isNew = timestamp > loadTime;
    const isReceived = from !== nick;
    
    if (isNew && isReceived) {
        try {
            const playPromise = notificationAudio.play();
            if (playPromise !== undefined) { playPromise.catch(e => {}); }
            if ("vibrate" in navigator) { navigator.vibrate([200]); }
        } catch(e) {}
        sendNativeNotification(from, texto);
        if (document.hidden) { document.title = `(1) ${from} diz...`; }
    }

    const div = document.createElement("div");
    div.dataset.key = key; 
    div.className = `message flex flex-col gap-1 ${from === nick ? 'sent' : 'received'}`; 

    const content = document.createElement("div");
    content.className = "message-content"; 
    div.appendChild(content);

    if (from === nick) {
        const editBtn = document.createElement("div");
        editBtn.className = "action-btn edit-btn";
        editBtn.title = "Editar Mensagem";
        editBtn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path><path d="M16.5 3.5l4 4L7 19l-4 1 1-4z"></path>
            </svg>
        `;
        editBtn.onclick = () => startEdit(key, content.textContent, content); 
        div.appendChild(editBtn);
        
    } else {
        const original = document.createElement("div");
        original.className = "original";
        div.appendChild(original);

        const menuTrigger = document.createElement("div");
        menuTrigger.className = "action-btn menu-trigger";
        menuTrigger.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="12" cy="5" r="1"></circle>
                <circle cx="12" cy="19" r="1"></circle>
            </svg>
        `;

        const menu = document.createElement("div");
        menu.className = "options-menu";
        
        const optRetry = document.createElement("div");
        optRetry.className = "options-item retry-opt";
        optRetry.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.5 15a9 9 0 0 1 14.8-8.8L23 10"></path><path d="M1 14l4.7 4.7A9 9 0 0 0 20.5 9"></path></svg>
            <span>Retraduzir</span>
        `;
        optRetry.onclick = (e) => {
            e.stopPropagation(); 
            resetAllContexts(); 
            retraduzirMensagem(key, content);
            menu.classList.remove('show', 'open-left', 'open-right');
        };

        const optVar = document.createElement("div");
        optVar.className = "options-item var-opt";
        optVar.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
            <span>Variações</span>
        `;
        optVar.onclick = async (e) => {
            e.stopPropagation();
            resetAllContexts(); 
            menu.classList.remove('show', 'open-left', 'open-right');

            const currentContentElement = content;
            const latestData = messageElements[key]?.data;
            const originalText = latestData ? latestData.texto : original.textContent;
            const variantsUl = document.getElementById("variants");
            const loadMoreBtn = document.getElementById("loadMore");
            const modal = document.getElementById("modal");

            variantsUl.innerHTML = "<li class='text-gray-500 text-center py-4 animate-pulse'>Gerando variações...</li>";
            modal.style.display = "flex";
            
            const addItems = (items) => {
                items.forEach(v => {
                    const li = document.createElement('li');
                    li.className = 'variant-item text-gray-800'; 
                    li.textContent = v;
                    li.onclick = () => selectTranslation(key, v, currentContentElement); 
                    variantsUl.appendChild(li);
                });
            };

            try {
                const vars = await gerarVariacoes(originalText, TARGET_LANG);
                variantsUl.innerHTML = '';
                addItems(vars);
            } catch (e) {
                variantsUl.innerHTML = "<li class='text-red-500 text-center'>Erro ao gerar. Tente novamente.</li>";
            }
             
             loadMoreBtn.onclick = async () => {
                  const originalBtnText = loadMoreBtn.innerHTML;
                  loadMoreBtn.innerHTML = `<span class="animate-spin inline-block mr-1">↻</span> Gerando...`;
                  loadMoreBtn.disabled = true;
                  loadMoreBtn.classList.add('opacity-50', 'cursor-not-allowed');
                  try {
                      const moreVars = await gerarVariacoes(originalText, TARGET_LANG, 3);
                      addItems(moreVars);
                      variantsUl.scrollTo({ top: variantsUl.scrollHeight, behavior: 'smooth' });
                  } catch (e) { console.error(e); } finally {
                      loadMoreBtn.innerHTML = originalBtnText;
                      loadMoreBtn.disabled = false;
                      loadMoreBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                  }
              };
        };

        const optCtx = document.createElement("div");
        optCtx.className = "options-item ctx-opt";
        optCtx.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
            <span>Contexto</span>
        `;
        optCtx.onclick = async (e) => {
            e.stopPropagation();
            resetAllContexts();
            menu.classList.remove('show', 'open-left', 'open-right');

            const latestData = messageElements[key]?.data;
            const textoOriginal = latestData?.texto;
            if (!textoOriginal) return;

            content.textContent = "Analisando contexto...";
            content.classList.add("italic", "text-gray-400");

            try {
                const contexto = await analisarContexto(textoOriginal, TARGET_LANG);
                content.textContent = contexto;
                content.classList.add("context-text");
                content.classList.remove("italic", "text-gray-400");
                
                content.onclick = () => {
                   const currentData = messageElements[key]?.data;
                   if (currentData) {
                       updateMessageDOM(div, currentData, key);
                   }
                };

            } catch (e) {
                content.textContent = "Erro ao analisar contexto.";
                setTimeout(() => {
                   const currentData = messageElements[key]?.data;
                   if (currentData) updateMessageDOM(div, currentData, key);
                }, 3000);
            }
        };

        menu.appendChild(optRetry);
        menu.appendChild(optVar);
        menu.appendChild(optCtx);

        menuTrigger.onclick = (e) => {
            e.stopPropagation();
            resetAllContexts(); 

            const isShown = menu.classList.contains('show');
            
            document.querySelectorAll('.options-menu.show').forEach(m => {
                m.classList.remove('show', 'open-left', 'open-right');
            });

            if (isShown) return; 

            menu.classList.add('show');

            const btnRect = menuTrigger.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect();
            
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            let top = btnRect.top + (btnRect.height / 2) - (menuRect.height / 2);
            
            if (top < 10) top = 10;
            if (top + menuRect.height > viewportHeight - 10) {
                top = viewportHeight - menuRect.height - 10;
            }
            
            let openedLeft = false;
            let left = btnRect.right + 10; 
            
            if (left + menuRect.width > viewportWidth - 5) {
                left = btnRect.left - menuRect.width - 10;
                openedLeft = true;
            }
            
            menu.style.top = `${top}px`;
            menu.style.left = `${left}px`;
            
            if (openedLeft) {
                menu.classList.add('open-left');
                menu.classList.remove('open-right');
            } else {
                menu.classList.add('open-right');
                menu.classList.remove('open-left');
            }
        };

        div.appendChild(menuTrigger);
        div.appendChild(menu);
    }
    
    const timeContainer = document.createElement("div");
    timeContainer.className = "time-container";
    
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = new Date(timestamp).toLocaleTimeString("pt-BR", { hour: '2-digit', minute: '2-digit' });
    timeContainer.appendChild(time);
    
    div.appendChild(timeContainer);
    
    updateMessageDOM(div, data, key); 

    return div;
  }
  
  onChildAdded(query(ref(db, `salas/${SALA_ID}/mensagens`), orderByChild("timestamp")), snap => {
    const key = snap.key;
    const data = snap.val();
    
    if (!messageElements[key]) {
        const div = createMessageDom(data, key);
        messageElements[key] = { dom: div, data: data };
        
        // Adiciona a mensagem e garante que o indicador de digitação fique por último
        chatEl.appendChild(div);
        chatEl.appendChild(typingIndicator); 
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  });

  onChildChanged(ref(db, `salas/${SALA_ID}/mensagens`), snap => {
    const key = snap.key;
    const data = snap.val();
    
    if (messageElements[key]) {
        messageElements[key].data = data; 
        updateMessageDOM(messageElements[key].dom, data, key);
    }
  });

  document.getElementById("send").onclick = async () => {
    // Forçar paragem do estado de typing imediatamente
    if (typingTimeout) clearTimeout(typingTimeout);
    update(presenceRef, { typing: false });

    resetAllContexts();
    
    const texto = msgEl.value.trim();
    if (!texto) return;

    await push(ref(db, `salas/${SALA_ID}/mensagens`), {
      nick,
      texto,
      timestamp: Date.now()
    });

    msgEl.value = "";

    try {
        const msgsRef = ref(db, `salas/${SALA_ID}/mensagens`);
        const snapshot = await get(query(msgsRef, orderByChild("timestamp")));
        
        if (snapshot.size > 20) {
            const mensagensParaApagar = [];
            let count = 0;
            const limiteExclusao = snapshot.size - 20;

            snapshot.forEach((child) => {
                if (count < limiteExclusao) {
                    mensagensParaApagar.push(child.key);
                    count++;
                }
            });

            mensagensParaApagar.forEach((key) => {
                remove(ref(db, `salas/${SALA_ID}/mensagens/${key}`));
                if (messageElements[key]) {
                    messageElements[key].dom.remove();
                    delete messageElements[key];
                }
            });
        }
    } catch (erro) {
        console.error("Erro limpeza:", erro);
    }
  };
  
  msgEl.addEventListener("keypress", (e) => {
      if(e.key === "Enter") document.getElementById("send").click();
  });

  document.getElementById("closeModal").onclick = () => {
    document.getElementById("modal").style.display = "none";
  };
</script>
</body>
</html>
